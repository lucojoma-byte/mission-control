<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">
  <title>Guardian Ops · Holding</title>
  <style>
    :root {
      --fondo: #0b0e14;
      --superficie: #121722;
      --superficie-2: #181f2d;
      --superficie-3: #20293a;
      --borde: #293244;
      --texto: #f3f5f7;
      --suave: #9aa6b6;
      --acento: #d6aa53;
      --acento-2: #f1d28d;
      --verde: #32c877;
      --amarillo: #e8b84b;
      --rojo: #ef5b5b;
      --azul: #58a6ff;
      --radio: 16px;
      --sombra: 0 16px 40px rgba(0, 0, 0, 0.24);
      --sidebar: 242px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }
    [hidden] { display: none !important; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--sidebar);
      padding: 24px 16px;
      border-right: 1px solid var(--borde);
      background: #0e121a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px 22px;
      border-bottom: 1px solid var(--borde);
    }
    .brand__mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--acento) 70%, var(--borde));
      border-radius: 11px;
      color: var(--acento);
      background: color-mix(in srgb, var(--acento) 10%, transparent);
      font-weight: 900;
    }
    .brand__eyebrow {
      margin: 0;
      color: var(--acento);
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .brand__name { margin: 1px 0 0; font-size: 1.02rem; }
    .nav { display: grid; gap: 5px; margin-top: 22px; }
    .nav__link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--suave);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 650;
    }
    .nav__icon {
      width: 24px;
      color: inherit;
      text-align: center;
      font-size: .92rem;
    }
    .nav__link:hover, .nav__link:focus-visible {
      border-color: var(--borde);
      color: var(--texto);
      outline: none;
    }
    .nav__link[aria-current="page"] {
      border-color: color-mix(in srgb, var(--acento) 38%, var(--borde));
      color: var(--acento-2);
      background: color-mix(in srgb, var(--acento) 10%, transparent);
    }
    .sidebar__foot {
      position: absolute;
      right: 16px;
      bottom: 20px;
      left: 16px;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      color: var(--suave);
      background: var(--superficie);
      font-size: .72rem;
    }
    .sidebar__foot strong { display: block; color: var(--texto); font-size: .78rem; }

    .main { min-height: 100vh; margin-left: var(--sidebar); padding: 28px 30px 108px; }
    .contenedor { width: min(1180px, 100%); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--acento);
      font-size: .72rem;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .page-title {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      letter-spacing: -.04em;
      line-height: 1.07;
    }
    .page-purpose { max-width: 720px; margin: 8px 0 0; color: var(--suave); font-size: .92rem; }
    .date { margin: 2px 0 0; color: var(--suave); text-align: right; white-space: nowrap; }

    .card {
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      background: var(--superficie);
      box-shadow: var(--sombra);
    }
    .section-card { padding: 20px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 15px;
    }
    .section-title { margin: 0; font-size: 1rem; }
    .section-help { margin: 0; color: var(--suave); font-size: .8rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      color: var(--suave);
      background: var(--superficie-2);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }
    .status--active { border-color: color-mix(in srgb, var(--verde) 45%, var(--borde)); color: var(--verde); }
    .status--build { border-color: color-mix(in srgb, var(--amarillo) 45%, var(--borde)); color: var(--amarillo); }

    .priorities { margin-bottom: 22px; }
    .priority-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .priority {
      display: flex;
      align-items: center;
      min-height: 54px;
      gap: 10px;
      padding: 10px 13px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--superficie-2);
    }
    .priority input[type="checkbox"] {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      margin: 0;
      accent-color: var(--acento);
      cursor: pointer;
    }
    .priority input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 3px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      color: var(--texto);
      background: transparent;
      outline: none;
    }
    .priority input[type="text"]:focus { border-color: var(--acento); }
    .priority--done input[type="text"] { color: var(--suave); text-decoration: line-through; }

    .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
    .quick-metric { padding: 16px; }
    .quick-metric__label { display: block; color: var(--suave); font-size: .74rem; }
    .quick-metric__value { display: block; margin-top: 5px; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
    .quick-metric__meta { display: block; margin-top: 3px; color: var(--suave); font-size: .7rem; }
    .quick-metric__value--ok { color: var(--verde); }
    .quick-metric__value--warn { color: var(--amarillo); }

    .panel-head { margin: 0 0 15px; }
    .panel-title { margin: 0 0 3px; font-size: 1.15rem; }
    .panel-subtitle { margin: 0; color: var(--suave); font-size: .86rem; }
    .front-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .front-card {
      --state-color: var(--amarillo);
      min-height: 264px;
      padding: 21px;
      border-left: 5px solid var(--state-color);
    }
    .front-card--wide { grid-column: 1 / -1; }
    .front-card--verde { --state-color: var(--verde); }
    .front-card--amarillo { --state-color: var(--amarillo); }
    .front-card--rojo { --state-color: var(--rojo); }
    .front-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .front-title { margin: 0; font-size: 1.05rem; }
    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid color-mix(in srgb, var(--state-color) 48%, transparent);
      border-radius: 999px;
      color: var(--state-color);
      background: color-mix(in srgb, var(--state-color) 10%, transparent);
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .state-pill::before { width: 8px; height: 8px; border-radius: 50%; background: currentColor; content: ""; }
    .state-control { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .state-control__label { margin-right: 2px; color: var(--suave); font-size: .72rem; }
    .state-button {
      --option-color: var(--suave);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid var(--borde);
      border-radius: 9px;
      color: var(--suave);
      background: var(--superficie-2);
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .state-button::before { width: 8px; height: 8px; border-radius: 50%; background: var(--option-color); content: ""; }
    .state-button--verde { --option-color: var(--verde); }
    .state-button--amarillo { --option-color: var(--amarillo); }
    .state-button--rojo { --option-color: var(--rojo); }
    .state-button[aria-pressed="true"] {
      border-color: var(--option-color);
      color: var(--option-color);
      background: color-mix(in srgb, var(--option-color) 12%, var(--superficie-2));
    }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }
    .metric { min-width: 0; padding: 12px; border: 1px solid var(--borde); border-radius: 11px; background: var(--superficie-2); }
    .metric__label { display: block; overflow: hidden; color: var(--suave); font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
    .metric__value { display: block; margin-top: 3px; font-size: 1.18rem; font-weight: 750; }
    .note { margin: 0; padding-top: 13px; border-top: 1px solid var(--borde); color: var(--suave); font-size: .82rem; }
    .note strong { color: var(--texto); }

    .module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .module-card { display: flex; flex-direction: column; min-height: 205px; padding: 19px; }
    .module-card__kicker { color: var(--acento); font-size: .7rem; font-weight: 800; text-transform: uppercase; }
    .module-card h3 { margin: 9px 0 6px; font-size: 1.05rem; }
    .module-card p { margin: 0; color: var(--suave); font-size: .84rem; }
    .module-card .button { margin-top: auto; align-self: flex-start; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--superficie-2);
      font-weight: 700;
      font-size: .82rem;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover, .button:focus-visible { border-color: var(--acento); outline: none; }
    .button--primary { border-color: var(--acento); color: #111; background: var(--acento); }
    .button--danger { border-color: color-mix(in srgb, var(--rojo) 55%, var(--borde)); color: var(--rojo); }

    .field-shell { max-width: 880px; margin: 0 auto; }
    .field-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .field-step {
      padding: 10px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--suave);
      background: var(--superficie);
      text-align: center;
      font-size: .76rem;
      font-weight: 750;
    }
    .field-step--active { border-color: var(--acento); color: var(--acento-2); }
    .field-card { padding: clamp(18px, 4vw, 30px); }
    .field-card h2 { margin: 0 0 5px; font-size: 1.35rem; }
    .field-card > p { margin: 0 0 22px; color: var(--suave); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field--wide { grid-column: 1 / -1; }
    .field label { color: var(--suave); font-size: .8rem; font-weight: 700; }
    .input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      color: var(--texto);
      background: var(--superficie-2);
      outline: none;
    }
    textarea.input { min-height: 112px; resize: vertical; }
    .input:focus { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 13%, transparent); }
    .photo-zone {
      display: grid;
      min-height: 118px;
      align-items: start;
      padding: 18px;
      border: 1px dashed color-mix(in srgb, var(--acento) 55%, var(--borde));
      border-radius: 12px;
      color: var(--suave);
      background: color-mix(in srgb, var(--acento) 5%, var(--superficie-2));
      text-align: center;
      cursor: pointer;
    }
    .photo-zone strong { display: block; color: var(--texto); }
    .photo-zone__body { display: grid; gap: 12px; width: 100%; }
    .photo-zone__empty { display: grid; gap: 4px; }
    .photo-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .photo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      color: var(--texto);
      background: var(--superficie-2);
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .photo-button:hover, .photo-button:focus-visible { border-color: var(--acento); outline: none; }
    .photo-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      width: 100%;
    }
    .photo-preview-card {
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--superficie);
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }
    .photo-preview-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: inherit;
      cursor: zoom-in;
    }
    .photo-preview-card img {
      display: block;
      width: 100%;
      height: clamp(220px, 34vw, 320px);
      object-fit: contain;
      background: color-mix(in srgb, var(--superficie-2) 82%, black);
    }
    .photo-preview-card span {
      display: block;
      padding: 8px 10px;
      color: var(--suave);
      font-size: .72rem;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .photo-preview-hint {
      margin-top: 8px;
      color: var(--suave);
      font-size: .72rem;
      text-align: left;
    }
    .field-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .field-actions .button { min-height: 52px; padding-inline: 20px; font-size: .9rem; }
    .visit-history {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .visit-history__head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .visit-history__head h3 { margin: 0; font-size: 1rem; }
    .visit-history__head p { margin: 4px 0 0; color: var(--suave); font-size: .8rem; }
    .visit-history__list {
      display: grid;
      gap: 12px;
    }
    .visit-card {
      padding: 16px;
      border: 1px solid var(--borde);
      border-radius: 14px;
      background: var(--superficie-2);
    }
    .visit-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .visit-card__title { margin: 0; font-size: .98rem; }
    .visit-card__time { color: var(--suave); font-size: .74rem; white-space: nowrap; }
    .visit-card__meta,
    .visit-card__ids {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
    }
    .visit-card__meta li,
    .visit-card__ids li {
      padding: 6px 9px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      color: var(--suave);
      background: var(--superficie);
      font-size: .72rem;
    }
    .visit-card__note {
      margin: 0 0 12px;
      color: var(--suave);
      font-size: .78rem;
    }
    .visit-card__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .visit-card__actions .button { min-height: 40px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie); }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--borde); text-align: left; font-size: .82rem; }
    th { color: var(--suave); background: var(--superficie-2); font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    .table-title { color: var(--texto); font-weight: 750; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .search { width: min(390px, 100%); min-height: 43px; padding: 10px 13px; border: 1px solid var(--borde); border-radius: 10px; color: var(--texto); background: var(--superficie); outline: none; }
    .search:focus { border-color: var(--acento); }
    .empty { padding: 36px 20px; color: var(--suave); text-align: center; }

    .report-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .report { padding: 20px; }
    .report__label { color: var(--suave); font-size: .76rem; }
    .report__value { display: block; margin-top: 7px; font-size: 1.75rem; font-weight: 850; }
    .report__detail { margin: 7px 0 0; color: var(--suave); font-size: .78rem; }

    .quickbar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: var(--sidebar);
      z-index: 20;
      padding: 11px 30px;
      border-top: 1px solid var(--borde);
      background: rgba(11, 14, 20, .94);
      backdrop-filter: blur(14px);
    }
    .quickbar__content { display: flex; align-items: center; gap: 9px; overflow-x: auto; scrollbar-width: none; }
    .quickbar__content::-webkit-scrollbar { display: none; }
    .quick-link { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--borde); border-radius: 9px; color: var(--texto); background: var(--superficie); font-size: .78rem; text-decoration: none; cursor: pointer; }
    .quick-link:hover, .quick-link:focus-visible { border-color: var(--acento); outline: none; }
    .quick-link--label { border-color: transparent; color: var(--suave); background: transparent; font-weight: 750; pointer-events: none; }
    body.campo-mode .quickbar,
    body.campo-mode .sidebar__foot,
    body.campo-mode .nav__link:not([data-route="/holding/campo"]):not([data-route="/holding/mission-control"]) { display: none; }
    body.campo-mode .main { padding-bottom: 24px; }
    .file-input { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 74px;
      z-index: 50;
      max-width: min(380px, calc(100% - 40px));
      padding: 11px 14px;
      border: 1px solid var(--verde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--superficie-2);
      box-shadow: var(--sombra);
      font-size: .82rem;
    }
    .toast--error { border-color: var(--rojo); }
    .photo-modal[hidden] { display: none !important; }
    .photo-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(5, 8, 14, .86);
      backdrop-filter: blur(8px);
    }
    .photo-modal__dialog {
      width: min(980px, 100%);
      max-height: min(92vh, 980px);
      padding: 14px;
      border: 1px solid var(--borde);
      border-radius: 18px;
      background: var(--superficie);
      box-shadow: var(--sombra);
    }
    .photo-modal__topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .photo-modal__title {
      margin: 0;
      color: var(--texto);
      font-size: .92rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .photo-modal__close {
      flex: 0 0 auto;
      min-width: 44px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--superficie-2);
      cursor: pointer;
    }
    .photo-modal__frame {
      display: grid;
      place-items: center;
      min-height: min(72vh, 720px);
      border-radius: 14px;
      background: color-mix(in srgb, var(--superficie-2) 82%, black);
      overflow: hidden;
    }
    .photo-modal__frame img {
      display: block;
      max-width: 100%;
      max-height: min(72vh, 720px);
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .menu-button { display: none; }

    @media (max-width: 980px) {
      :root { --sidebar: 82px; }
      .sidebar { width: var(--sidebar); padding-inline: 12px; }

  <script>

    const RUTAS = [

    };

    const configuracionMetricas = {
      casa_kiraz: [["citas_semana", "Citas esta semana", "numero"], ["meta_citas", "Meta de citas", "numero"], ["caja_semana", "Caja semanal", "moneda"]],
      tiktok_shop: [["candidatos_pipeline", "Candidatos", "numero"], ["productos_en_test", "Productos en test", "numero"], ["ventas_validadas", "Ventas validadas", "numero"]],
      trading: [["pnl_semana", "P&L semanal", "resultado"], ["reglas_cumplidas_pct", "Reglas cumplidas", "porcentaje"], ["drawdown_pct", "Drawdown", "porcentaje"], ["drawdown_limite", "Límite de drawdown", "porcentaje"]],
      real_estate_e2: [["candidatos_evaluados_mes", "Evaluados este mes", "numero"], ["en_analisis_profundo", "Análisis profundo", "numero"], ["dias_desde_ultimo_barrido", "Días desde barrido", "numero"]],
      sistema: [["prioridades_completadas_semana", "Prioridades completadas", "numero"], ["automatizaciones_activas", "Automatizaciones activas", "numero"], ["automatizaciones_caidas", "Automatizaciones caídas", "numero"]]
    };
    const estadosOperativos = { verde: "Operando / Validado", amarillo: "En proceso / En pausa", rojo: "Alerta / Desechado" };

    const modulos = [
      ["Mission Control", "Tablero ejecutivo con prioridades, frentes, semáforos y señales operativas.", "/holding/mission-control", "Activo"],
      ["Campo", "Captura guiada para visitas, medidas, evidencia y notas desde tablet.", "/holding/campo", "Piloto"],
      ["CRM", "Seguimiento central de prospectos, clientes y siguiente acción.", "/holding/crm", "En construcción"],
      ["Cotizaciones", "Bandeja para preparar, revisar y dar seguimiento a propuestas.", "/holding/cotizaciones", "En construcción"],
      ["Aprobaciones", "Decisiones que requieren autorización humana antes de avanzar.", "/holding/aprobaciones", "En construcción"],
      ["Reportes", "Indicadores operativos, comerciales y financieros del holding.", "/holding/reportes", "En construcción"]
    ];

    function copiaInicial() { return JSON.parse(JSON.stringify(estadoInicial)); }

    function consecutivoDesdeValor(valor, extra = 0) {
      const digitos = String(Math.abs(Number(valor) || Date.now()) + extra).replace(/\D/g, "");
      return digitos.slice(-6).padStart(6, "0");
    }

    function derivarIdsVisita(visita = {}, indice = 0) {
      const fuente = visita.id || visita.guardadoEn || Date.now() + indice;
      return {
        clienteId: visita.clienteId || `CL-${consecutivoDesdeValor(fuente, indice * 3)}`,
        leadId: visita.leadId || `LE-${consecutivoDesdeValor(fuente, (indice * 3) + 1)}`,
        ticketId: visita.ticketId || `TK-${consecutivoDesdeValor(fuente, (indice * 3) + 2)}`,
      };
    }

    function borradorCRMInicial() {
      return {
        cliente: "",
        telefono: "",
        direccion: "",
        zona: "",
        interes: "",
        estado: "Nuevo",
        siguienteAccion: "",
        fechaSeguimiento: "",
        responsable: "",
        clienteId: "",
        leadId: "",
        ticketId: "",
        resumen: "",
        registroUrl: "",
        origen: "manual"
      };
    }

    function resumenCRMDesdeBorrador(borrador = {}) {
      return [
        `Cliente ID: ${borrador.clienteId || "Pendiente"}`,
        `Lead ID: ${borrador.leadId || "Pendiente"}`,
        `Ticket ID: ${borrador.ticketId || "Pendiente"}`,
        `Cliente: ${borrador.cliente || "Sin cliente"}`,
        `Teléfono: ${borrador.telefono || "Sin teléfono"}`,
        `Dirección: ${borrador.direccion || "Sin dirección"}`,
        `Zona: ${borrador.zona || "Por definir"}`,
        `Interés: ${borrador.interes || "Sin servicio"}`,
        `Siguiente acción: ${borrador.siguienteAccion || "Sin acción"}`,
        `Estado sugerido: ${borrador.estado || "Nuevo"}`,
        borrador.resumen ? `Notas CRM: ${borrador.resumen}` : "Notas CRM: Sin notas"
      ].join("\n");
    }

    function crearBorradorCRMDesdeVisita(visita = {}) {
      const borrador = {
        ...borradorCRMInicial(),
        cliente: visita.cliente || "",
        telefono: visita.telefono || "",
        direccion: visita.direccion || "",
        zona: visita.zona || zonaDesdeDireccion(visita.direccion),
        interes: visita.servicio || "",
        estado: estadoCRMDesdeVisita(visita),
        siguienteAccion: siguienteAccionDesdeVisita(visita),
        fechaSeguimiento: visita.fechaSeguimiento || "",
        responsable: visita.responsable || "",
        clienteId: visita.clienteId || "",
        leadId: visita.leadId || "",
        ticketId: visita.ticketId || "",
        registroUrl: visita.registroUrl || "",
        resumen: [
          visita.ancho || visita.alto ? `Medidas: ${visita.ancho || "s/d"}m x ${visita.alto || "s/d"}m` : "",
          visita.condicion ? `Condición: ${visita.condicion}` : "",
          visita.notas ? `Notas: ${visita.notas}` : ""
        ].filter(Boolean).join("\n"),
        origen: "campo"
      };
      return { ...borrador, resumenCompleto: resumenCRMDesdeBorrador(borrador) };
    }

    function construirPayloadSheets(prospecto = {}, visita = null) {
      const notas = [
        prospecto.resumen ? `Resumen CRM:\n${prospecto.resumen}` : "",
        visita?.registroPath ? `Registro Campo: ${visita.registroPath}` : visita?.registroUrl ? `Registro Campo: ${visita.registroUrl}` : prospecto.registroUrl ? `Registro Campo: ${prospecto.registroUrl}` : "",
        visita?.id && /^vis-\d{10,}-[0-9a-f]{6}$/.test(visita.id) && visita.storage === "vercel-blob-private"
          ? `Ver fotos (${(visita.fotosRemotas || []).length}): ${window.location.origin}/api/campo-fotos?visita=${visita.id}`
          : "",
      ].filter(Boolean).join("\n\n");

      return {
        prospecto: {
          ...prospecto,
          direccion: prospecto.direccion || visita?.direccion || "",
          fechaSeguimiento: prospecto.fechaSeguimiento || visita?.fechaSeguimiento || "",
          responsable: prospecto.responsable || visita?.responsable || "",
          registroUrl: prospecto.registroUrl || visita?.registroUrl || "",
          notasSheets: notas,
        },
        visita,
      };
    }

    // ===== Sesión por persona =====
    let sesionActual = null;
    const NOMBRES_ROL = { dueno: "Dueño", secretaria: "Secretaria", campo: "Campo" };

    function aplicarSesion(sesion) {
      sesionActual = sesion || null;
      document.body.classList.toggle("rol-campo", sesionActual?.rol === "campo");
      document.body.classList.toggle("rol-admin", ["dueno", "secretaria"].includes(sesionActual?.rol));
      let chip = document.getElementById("sesion-chip");
      if (!chip) {
        chip = document.createElement("div");
        chip.id = "sesion-chip";
        chip.className = "sesion-chip";
        document.body.appendChild(chip);
      }
      chip.innerHTML = sesionActual
        ? `<span>${escapeHtml(sesionActual.nombre)} · ${NOMBRES_ROL[sesionActual.rol] || ""}</span><button type="button" id="sesion-salir">Salir</button>`
        : `<span>Sin sesión</span><button type="button" id="sesion-entrar">Entrar</button>`;
      document.getElementById("sesion-salir")?.addEventListener("click", cerrarSesion);
      document.getElementById("sesion-entrar")?.addEventListener("click", () => solicitarAccesoPrivado().then(() => renderRuta()).catch(() => null));
      if (sesionActual?.rol === "campo" && !rutaActual().startsWith("/holding/campo")) navegar("/holding/campo");
      if (sesionActual) cargarVisitasCompartidas({ forzar: true });
    }

    async function cargarSesion() {
      const respuesta = await fetch("/api/sesion", { credentials: "same-origin" }).catch(() => null);
      const data = respuesta && respuesta.ok ? await respuesta.json().catch(() => ({})) : {};
      aplicarSesion(data?.sesion || null);
    }

    async function cerrarSesion() {
      await fetch("/api/auth-logout", { method: "POST", credentials: "same-origin" }).catch(() => null);
      aplicarSesion(null);
      mostrarToast("Sesión cerrada.");
      renderRuta();
    }

    let accesoEnCurso = null;
    function solicitarAccesoPrivado() {
      if (accesoEnCurso) return accesoEnCurso;
      accesoEnCurso = new Promise((resolve, reject) => {
        const fondo = document.createElement("div");
        fondo.className = "acceso-fondo";
        fondo.innerHTML = `
          <form class="acceso-caja" id="acceso-form" autocomplete="on">
            <h2>Guardian Ops</h2>
            <p>Entra con tu usuario y contraseña. El Dueño puede dejar el usuario vacío.</p>
            <input class="input" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuario" enterkeyhint="next">
            <input class="input" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required enterkeyhint="go">
            <div class="acceso-error" id="acceso-error"></div>
            <button class="button button--primary" type="submit">Entrar</button>
            <button class="button" type="button" id="acceso-cancelar">Cancelar</button>
          </form>`;
        document.body.appendChild(fondo);
        const form = fondo.querySelector("#acceso-form");
        const cerrar = () => { fondo.remove(); accesoEnCurso = null; };
        form.usuario.focus();
        fondo.querySelector("#acceso-cancelar").addEventListener("click", () => { cerrar(); reject(new Error("Acceso cancelado.")); });
        form.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          const error = fondo.querySelector("#acceso-error");
          error.textContent = "";
          const respuesta = await fetch("/api/auth-login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario: form.usuario.value.trim(), password: form.password.value }),
          }).catch(() => null);
          const data = respuesta ? await respuesta.json().catch(() => ({})) : {};
          if (!respuesta || !respuesta.ok || !data?.ok) {
            error.textContent = data?.error || "No se pudo iniciar sesión.";
            form.password.value = "";
            form.password.focus();
            return;
          }
          cerrar();
          aplicarSesion(data.sesion);
          resolve(data.sesion);
        });
      });
      return accesoEnCurso;
    }

    async function fetchProtegido(url, opciones = {}) {
      const configuracion = { ...opciones, credentials: "same-origin" };
      let respuesta = await fetch(url, configuracion);
      if (respuesta.status === 401) {
        await solicitarAccesoPrivado();
        respuesta = await fetch(url, configuracion);
      }
      return respuesta;
    }

    async function guardarProspectoEnSheets(prospecto = {}, visita = null) {
      const respuesta = await fetchProtegido("/api/crm-prospectos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(construirPayloadSheets(prospecto, visita)),
      });

      const data = await respuesta.json().catch(() => ({}));
      if (!respuesta.ok || !data?.ok) {
        throw new Error(data?.error || "No se pudo sincronizar el prospecto con Google Sheets.");
      }
      return data;
    }

    // Envía la visita recién guardada a la hoja del CRM con sus mismos Cliente/Lead/Ticket ID.
    // El servidor ignora el envío si ese Lead ID ya existe, así que reintentar no duplica filas.
    async function sincronizarVisitaConCRM(visita) {
      if (!visita) return { ok: false, error: "visita no encontrada" };
      const borrador = crearBorradorCRMDesdeVisita(visita);
      const prospecto = normalizarProspectoCRM({ ...borrador, origen: "campo" }, estado.crm.prospectos.length);
      try {
        const respuesta = await guardarProspectoEnSheets(prospecto, visita);
        const sincronizacion = {
          pendiente: false,
          ok: true,
          actualizadoEn: respuesta?.sheet?.updatedAt || new Date().toISOString(),
          fila: respuesta?.sheet?.updatedRange || "",
        };
        if (!estado.crm.prospectos.some((item) => item.leadId === prospecto.leadId)) {
          estado.crm.prospectos.unshift({ ...prospecto, sincronizacion });
        }
        visita.crm = sincronizacion;
        guardarEstado();
        cargarProspectosDesdeSheets({ forzar: true }).catch(() => null);
        return { ok: true };
      } catch (error) {
        const mensaje = error instanceof Error ? error.message : "sin respuesta";
        visita.crm = { pendiente: true, ok: false, error: mensaje };
        guardarEstado();
        return { ok: false, error: mensaje };
      }
    }

    // ===== Visitas compartidas (servidor) =====
    // La lista de visitas viene del almacén privado: todos ven lo mismo según su rol.
    const visitasCompartidas = { cargando: false, ultimaCarga: 0 };

    async function cargarVisitasCompartidas({ forzar = false } = {}) {
      if (visitasCompartidas.cargando) return;
      if (!forzar && Date.now() - visitasCompartidas.ultimaCarga < 30000) return;
      visitasCompartidas.cargando = true;
      try {
        const respuesta = await fetch("/api/campo-visitas", { credentials: "same-origin" }).catch(() => null);
        if (!respuesta || !respuesta.ok) return;
        const data = await respuesta.json().catch(() => ({}));
        if (!Array.isArray(data?.visitas)) return;
        const delServidor = new Set(data.visitas.map((visita) => visita.id));
        const locales = estado.campo.guardados.filter((visita) => !delServidor.has(visita.id) && visita.storage !== "vercel-blob-private");
        const crmPorId = new Map(estado.campo.guardados.filter((v) => v.crm).map((v) => [v.id, v.crm]));
        estado.campo.guardados = [
          ...data.visitas.map((visita) => (crmPorId.has(visita.id) ? { ...visita, crm: crmPorId.get(visita.id) } : visita)),
          ...locales,
        ];
        guardarEstado();
      } finally {
        // Se marca siempre (aunque falle) para no reintentar en bucle sin sesión.
        visitasCompartidas.ultimaCarga = Date.now();
        visitasCompartidas.cargando = false;
        refrescarVistasDeVisitas();
      }
    }

    function refrescarVistasDeVisitas() {
      const ruta = rutaActual();
      const historial = document.getElementById("historial-campo");
      if (historial) {
        historial.innerHTML = renderHistorialCampo();
        historial.querySelectorAll("[data-route-link]").forEach((link) => link.addEventListener("click", (e) => {
          e.preventDefault();
          navegar(link.getAttribute("href"));
        }));
      }
      if (ruta === "/holding/campo/registro") renderRuta();
    }

    let cargaCRMDesdeSheetsActiva = null;
    let ultimoIntentoCargaCRM = 0;

    async function cargarProspectosDesdeSheets({ forzar = false } = {}) {
      if (cargaCRMDesdeSheetsActiva && !forzar) return cargaCRMDesdeSheetsActiva;

      estado.crm.sheet = {
        ...(estado.crm.sheet || {}),
        status: "loading",
        error: "",
      };
      guardarEstado();

      cargaCRMDesdeSheetsActiva = (async () => {
        const respuesta = await fetchProtegido("/api/crm-prospectos");
        const data = await respuesta.json().catch(() => ({}));
        if (!respuesta.ok || !data?.ok) {
          throw new Error(data?.error || "No pude leer Google Sheets.");
        }

        estado.crm.sheet = {
          status: "ok",
          rows: (Array.isArray(data.rows) ? data.rows : []).map((prospecto, indice) => normalizarProspectoCRM({
            ...prospecto,
            sincronizacion: {
              pendiente: false,
              ok: true,
              actualizadoEn: prospecto.actualizadoEn || data?.sheet?.updatedAt || new Date().toISOString(),
            },
          }, indice)),
          updatedAt: data?.sheet?.updatedAt || new Date().toISOString(),
          error: "",
        };
        guardarEstado();
        return estado.crm.sheet.rows;
      })();

      try {
        return await cargaCRMDesdeSheetsActiva;
      } catch (error) {
        estado.crm.sheet = {
          ...(estado.crm.sheet || {}),
          status: "error",
          error: error instanceof Error ? error.message : "No pude leer Google Sheets.",
        };
        guardarEstado();
        throw error;
      } finally {
        cargaCRMDesdeSheetsActiva = null;
      }
    }

    function normalizarProspectoCRM(prospecto = {}, indice = 0) {
      const base = borradorCRMInicial();
      const mezcla = { ...base, ...prospecto };
      const fuente = prospecto.id || prospecto.creadoEn || Date.now() + indice;
      return {
        ...mezcla,
        id: prospecto.id || `crm-${consecutivoDesdeValor(fuente, indice)}`,
        creadoEn: prospecto.creadoEn || new Date().toISOString(),
        clienteId: mezcla.clienteId || `CL-${consecutivoDesdeValor(fuente, indice * 3)}`,
        leadId: mezcla.leadId || `LE-${consecutivoDesdeValor(fuente, (indice * 3) + 1)}`,
        ticketId: mezcla.ticketId || `TK-${consecutivoDesdeValor(fuente, (indice * 3) + 2)}`,
      };
    }

    function normalizarEstado(candidato) {
      const base = copiaInicial();
      const normal = candidato && typeof candidato === "object" ? candidato : base;
      normal.version = 7;
      normal.prioridades = Array.isArray(normal.prioridades) ? normal.prioridades : base.prioridades;
      normal.frentes = normal.frentes || base.frentes;
      Object.keys(base.frentes).forEach((clave) => {
        const guardado = normal.frentes[clave] || base.frentes[clave];
        guardado.semaforo = guardado.semaforo || guardado.semaforo_ejemplo || base.frentes[clave].semaforo;
        delete guardado.semaforo_ejemplo;
        normal.frentes[clave] = { ...base.frentes[clave], ...guardado, metricas: { ...base.frentes[clave].metricas, ...(guardado.metricas || {}) } };
      });
      normal.campo = normal.campo && typeof normal.campo === "object" ? normal.campo : base.campo;
      normal.campo.borrador = normal.campo.borrador || {};
      normal.campo.guardados = (Array.isArray(normal.campo.guardados) ? normal.campo.guardados : []).map((visita, indice) => ({
        ...visita,
        ...derivarIdsVisita(visita, indice),
      }));
      normal.crm = normal.crm && typeof normal.crm === "object" ? normal.crm : base.crm;
      normal.crm.borrador = { ...borradorCRMInicial(), ...(normal.crm.borrador || {}) };
      normal.crm.prospectos = (Array.isArray(normal.crm.prospectos) ? normal.crm.prospectos : []).map((prospecto, indice) => normalizarProspectoCRM(prospecto, indice));
      normal.crm.sheet = {
        status: ["idle", "loading", "ok", "error"].includes(normal.crm.sheet?.status) ? normal.crm.sheet.status : "idle",
        rows: (Array.isArray(normal.crm.sheet?.rows) ? normal.crm.sheet.rows : []).map((prospecto, indice) => normalizarProspectoCRM(prospecto, indice)),
        updatedAt: normal.crm.sheet?.updatedAt || "",
        error: normal.crm.sheet?.error || "",
      };
      return normal;
    }

    function cargarEstado() {
      try {
        const guardado = localStorage.getItem(CLAVE_ALMACENAMIENTO);
        return normalizarEstado(guardado ? JSON.parse(guardado) : copiaInicial());
      } catch (error) {
        console.warn("No se pudo leer el estado local.", error);
        return copiaInicial();
      }
    }

          minute: "2-digit"

      }

      return String(valor)

    function abrirPreviewGrande(url, nombre) {

      imagen.src = url;
      imagen.alt = nombre || "Vista ampliada de evidencia";
      titulo.textContent = nombre || "Vista ampliada";
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function cerrarPreviewGrande() {
      const modal = document.getElementById("photo-modal");

      const titulo = document.getElementById("photo-modal-title");
      if (!modal || !imagen || !titulo) return;
      modal.hidden = true;
      imagen.removeAttribute("src");

      titulo.textContent = "Vista ampliada";

      const respuesta = await fetchProtegido("/api/usuarios");

      if (!respuesta.ok || !data?.ok) throw new Error(data?.error || "No se pudieron cargar los usuarios.");
      usuariosCargados = data.usuarios;
      if (rutaActual() === "/holding/usuarios") renderRuta();
    }

    function renderUsuarios() {
      const esDueno = sesionActual?.rol === "dueno";
      const roles = esDueno ? ["campo", "secretaria", "dueno"] : ["campo"];
      const filas = (usuariosCargados || []).map((u) => `
        <tr>

    async function accionUsuario(cuerpo, exito) {
      const respuesta = await fetchProtegido("/api/usuarios", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
      const data = await respuesta.json().catch(() => ({}));
      if (!respuesta.ok || !data?.ok) {
        mostrarToast(data?.error || "No se pudo completar la operación.", "error");
        return false;
      }
      mostrarToast(exito);
      await cargarUsuarios().catch(() => null);
      return true;
    }

    function enlazarUsuarios() {
      if (usuariosCargados === null) {
        cargarUsuarios().catch((error) => { usuariosCargados = []; mostrarToast(error.message, "error"); renderRuta(); });
      }
      document.getElementById("usuario-nuevo")?.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const f = evento.target;
        await accionUsuario({ accion: "crear", nombre: f.nombre.value, usuario: f.usuario.value, rol: f.rol.value, password: f.password.value }, "Usuario creado. Entrégale su contraseña en persona.");

      document.querySelectorAll("[data-usuario-password]").forEach((boton) => boton.addEventListener("click", () => {

        if (password) accionUsuario({ accion: "cambiar-password", usuario: boton.dataset.usuarioPassword, password }, "Contraseña actualizada.");

    function guardarBorradorVisible() {
      document.querySelectorAll("[data-campo]").forEach(campo => { estado.campo.borrador[campo.dataset.campo] = campo.value; });
      guardarEstado();
    }

    function enlazarCampo() {
      document.querySelectorAll("[data-campo]").forEach(campo => campo.addEventListener("input", guardarBorradorVisible));
      // Enter avanza al siguiente campo; en el último, pasa al siguiente paso (no aplica en textos largos).
      const camposOrdenados = Array.from(document.querySelectorAll("input[data-campo], select[data-campo], textarea[data-campo]"));
      camposOrdenados.forEach((campo, indice) => campo.addEventListener("keydown", (evento) => {
        if (evento.key !== "Enter" || evento.isComposing || campo.tagName === "TEXTAREA") return;
        evento.preventDefault();
        const siguiente = camposOrdenados[indice + 1];
        if (siguiente) siguiente.focus();
        else document.getElementById("campo-siguiente")?.click();
      }));
      const renderizarPreviewsEnDOM = () => {
        const contenedor = document.getElementById("fotos-preview");
        if (!contenedor) return;
        contenedor.innerHTML = renderPreviewsCampo();
        contenedor.querySelectorAll(".photo-preview-button").forEach(boton => boton.addEventListener("click", () => {
          abrirPreviewGrande(boton.dataset.previewUrl, boton.dataset.previewNombre);
        }));
      };
      renderizarPreviewsEnDOM();
      // Cada foto se redibuja en canvas y se exporta como JPEG nuevo: eso elimina EXIF/GPS,
      // modelo del teléfono y fecha original. Si algo falla, la foto se rechaza; nunca se
      // sube el archivo original como alternativa.
      const MAX_FOTOS_CAMPO = 4;
      const MAX_BYTES_ORIGINAL = 15 * 1024 * 1024;
      const MAX_BYTES_COMPRIMIDA = 950 * 1000;
      const bytesDeDataUrl = (dataUrl) => Math.floor((dataUrl.length - dataUrl.indexOf(",") - 1) * 3 / 4);
      const cargarImagen = (archivo) => new Promise((resolve, reject) => {
        const url = URL.createObjectURL(archivo);
        const imagen = new Image();
        imagen.onload = () => { URL.revokeObjectURL(url); resolve(imagen); };
        imagen.onerror = () => { URL.revokeObjectURL(url); reject(new Error("formato no compatible")); };
        imagen.src = url;
      });
      const comprimirSinMetadatos = (imagen) => {
        for (const ladoMaximo of [1600, 1280, 1024]) {
          const escala = Math.min(1, ladoMaximo / Math.max(imagen.naturalWidth || 1, imagen.naturalHeight || 1));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round((imagen.naturalWidth || 1) * escala));
          canvas.height = Math.max(1, Math.round((imagen.naturalHeight || 1) * escala));
          const contexto = canvas.getContext("2d");
          if (!contexto) throw new Error("el navegador no pudo procesar la imagen");
          contexto.drawImage(imagen, 0, 0, canvas.width, canvas.height);
          for (const calidad of [0.8, 0.7, 0.6]) {
            const dataUrl = canvas.toDataURL("image/jpeg", calidad);
            if (!dataUrl.startsWith("data:image/jpeg;base64,")) throw new Error("el navegador no generó JPEG");
            if (bytesDeDataUrl(dataUrl) <= MAX_BYTES_COMPRIMIDA) return dataUrl;
          }
          canvas.width = 0;
          canvas.height = 0;
        }
        throw new Error("sigue pesando más de 1 MB tras comprimir");
      };
      const prepararPreviews = async (archivos) => {
        const lista = Array.from(archivos || []);
        if (lista.length > MAX_FOTOS_CAMPO) {
          mostrarToast(`Máximo ${MAX_FOTOS_CAMPO} fotos por visita. Elige menos fotos.`, "error");
          return [];
        }
        const listos = [];
        for (const archivo of lista) {
          const nombreBase = (archivo.name || "foto-capturada").replace(/\.[^.]+$/, "");
          try {
            if (archivo.size > MAX_BYTES_ORIGINAL) throw new Error("supera 15 MB");
            const imagen = await cargarImagen(archivo);
            listos.push({ nombre: `${nombreBase}.jpg`, url: comprimirSinMetadatos(imagen) });
          } catch (error) {
            mostrarToast(`No se pudo preparar "${nombreBase}": ${error.message}. No se agregó ninguna foto.`, "error");
            return [];
          }
        }
        return listos;
      };
      const actualizarResumenFotos = (archivos, origen) => {
        estado.campo.borrador.fotos = archivos.length
          ? `${archivos.length} foto${archivos.length === 1 ? "" : "s"} ${origen} lista(s) para guardar`
          : "";
        guardarEstado();
        document.getElementById("fotos-resumen").textContent = estado.campo.borrador.fotos || "Elige si quieres tomar foto o abrir galería";
      };
      const fotosCamara = document.getElementById("campo-fotos-camara");
      const fotosGaleria = document.getElementById("campo-fotos-galeria");
      if (fotosCamara) fotosCamara.addEventListener("change", async () => {
        previewsCampo = await prepararPreviews(fotosCamara.files);
        actualizarResumenFotos(previewsCampo, "tomada(s) con cámara");
        renderizarPreviewsEnDOM();
      });
      if (fotosGaleria) fotosGaleria.addEventListener("change", async () => {
        previewsCampo = await prepararPreviews(fotosGaleria.files);
        actualizarResumenFotos(previewsCampo, "seleccionada(s) desde galería");
        renderizarPreviewsEnDOM();
      });
      document.getElementById("campo-atras").addEventListener("click", () => {
        guardarBorradorVisible();
        if (pasoCampo > 1) pasoCampo -= 1;
        else {
          estado.campo.borrador = {};
          previewsCampo = [];
          guardarEstado();
          mostrarToast("Borrador limpio.");
        }
        renderRuta();
      });
      document.getElementById("campo-siguiente").addEventListener("click", async () => {
        guardarBorradorVisible();
        if (pasoCampo < 3) {
          if (pasoCampo === 1 && (!estado.campo.borrador.cliente || !estado.campo.borrador.servicio)) {
            mostrarToast("Captura cliente y servicio para continuar.", "error");
            return;
          }
          pasoCampo += 1;
          renderRuta();
          return;
        }
        if (guardandoCampo) return;
        guardandoCampo = true;
        try {
          const visitaBase = { ...estado.campo.borrador };
          const visitaRemota = await guardarVisitaRemota(visitaBase);
          estado.campo.guardados.unshift({
            ...visitaBase,
            id: visitaRemota.id,
            guardadoEn: visitaRemota.guardadoEn,
            clienteId: visitaRemota.clienteId,
            leadId: visitaRemota.leadId,
            ticketId: visitaRemota.ticketId,
            storage: visitaRemota.storage,
            registroUrl: visitaRemota.registroUrl,
            registroPath: visitaRemota.registroPath,
            fotosRemotas: visitaRemota.fotos,
          });
          estado.campo.borrador = {};
          previewsCampo = [];
          pasoCampo = 1;
          guardarEstado();
          const visitaGuardada = estado.campo.guardados[0];
          if (!visitaGuardada.responsable && visitaRemota.responsable) visitaGuardada.responsable = visitaRemota.responsable;
          visitaGuardada.capturadoPor = visitaRemota.capturadoPor || null;
          const crm = await sincronizarVisitaConCRM(visitaGuardada);
          const fotosTexto = visitaRemota.fotos?.length ? ` con ${visitaRemota.fotos.length} foto(s)` : " sin fotos";
          visitasCompartidas.ultimaCarga = 0;
          const avisoTexto = (visitaRemota.avisos || []).some((aviso) => aviso.enviado) ? " Aviso enviado." : "";
          if (crm.ok) mostrarToast(`Visita guardada${fotosTexto} y enviada al CRM (${visitaGuardada.ticketId}).${avisoTexto}`);
          else mostrarToast(`Visita guardada${fotosTexto}, pero el CRM no respondió: ${crm.error}. Usa "Pasar a CRM" para reintentar.`, "error");
          renderRuta();
        } catch (error) {
          mostrarToast(error instanceof Error ? error.message : "No se pudo guardar la visita.", "error");
        } finally {
          guardandoCampo = false;
        }
      });
    }

    function enlazarRegistroCampo() {
      document.querySelectorAll(".photo-preview-button").forEach((boton) => boton.addEventListener("click", () => {
        abrirPreviewGrande(boton.dataset.previewUrl, boton.dataset.previewNombre);
      }));
    }

    function enlazarCRM() {
      const refrescarDesdeSheets = async ({ silencioso = false, forzar = false } = {}) => {
        try {
          await cargarProspectosDesdeSheets({ forzar });
          if (rutaActual() === "/holding/crm") {
            renderRuta();
            if (!silencioso) mostrarToast("CRM actualizado desde Google Sheets.");
          }
        } catch (error) {
          if (rutaActual() === "/holding/crm") renderRuta();
          if (!silencioso) mostrarToast(error instanceof Error ? error.message : "No pude actualizar desde Google Sheets.", "error");
        }
      };

      if (Date.now() - ultimoIntentoCargaCRM > 15000 && estado.crm.sheet?.status !== "loading") {
        ultimoIntentoCargaCRM = Date.now();
        void refrescarDesdeSheets({ silencioso: true, forzar: true });
      }

      const sincronizarBorradorCRM = () => {
        document.querySelectorAll("[data-crm]").forEach((campo) => {
          estado.crm.borrador[campo.dataset.crm] = campo.value;
        });
        guardarEstado();
      };

      const idsBorradorCRM = () => ({
        clienteId: document.getElementById("crm-cliente-id")?.textContent?.trim() || estado.crm.borrador.clienteId || "",
        leadId: document.getElementById("crm-lead-id")?.textContent?.trim() || estado.crm.borrador.leadId || "",
        ticketId: document.getElementById("crm-ticket-id")?.textContent?.trim() || estado.crm.borrador.ticketId || "",
      });

      document.querySelectorAll("[data-crm]").forEach((campo) => campo.addEventListener("input", sincronizarBorradorCRM));

      const buscador = document.getElementById("buscar-crm");
      buscador.addEventListener("input", () => {
        const termino = buscador.value.toLocaleLowerCase("es");
        document.querySelectorAll("#crm-body tr").forEach(fila => { fila.hidden = !fila.textContent.toLocaleLowerCase("es").includes(termino); });
      });

      const refrescarSheets = document.getElementById("refrescar-crm-sheets");
      if (refrescarSheets) refrescarSheets.addEventListener("click", () => {
        ultimoIntentoCargaCRM = Date.now();
        void refrescarDesdeSheets({ forzar: true });
      });

      const copiarResumen = document.getElementById("copiar-resumen-crm");
      if (copiarResumen) copiarResumen.addEventListener("click", async () => {
        const campo = document.getElementById("crm-resumen-campo");
        sincronizarBorradorCRM();
        const texto = resumenCRMDesdeBorrador({ ...estado.crm.borrador, ...idsBorradorCRM() });
        if (campo) campo.value = estado.crm.borrador.resumen || "";
        try {
          if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(texto);
          else {
            campo.focus();
            campo.select();
            document.execCommand("copy");
          }
          mostrarToast("Resumen copiado. Pero ya no dependes de pegar: también puedes guardar aquí mismo.");
        } catch {
          mostrarToast("No pude copiar automáticamente. Selecciónalo y pégalo manualmente.", "error");
        }
      });

      const cargarVisita = document.getElementById("cargar-visita-en-crm");
      if (cargarVisita) cargarVisita.addEventListener("click", () => {
        const visita = visitaCRMDesdeRuta();
        if (!visita) {
          mostrarToast("No encontré una visita de Campo para cargar.", "error");
          return;
        }
        estado.crm.borrador = crearBorradorCRMDesdeVisita(visita);
        guardarEstado();
        renderRuta();
        mostrarToast("Visita cargada al editor del CRM.");
      });

      const guardarProspecto = document.getElementById("guardar-prospecto-crm");
      if (guardarProspecto) guardarProspecto.addEventListener("click", async () => {
        sincronizarBorradorCRM();
        const ids = idsBorradorCRM();
        const borrador = { ...estado.crm.borrador, ...ids };
        if (!String(borrador.cliente || "").trim()) {
          mostrarToast("Escribe al menos el nombre del cliente para guardar el prospecto.", "error");
          return;
        }
        const visita = visitaCRMDesdeRuta();
        const prospectoBase = normalizarProspectoCRM({
          ...borrador,
          origen: borrador.origen || (visita ? "campo" : "manual"),
          direccion: borrador.direccion || visita?.direccion || "",
          fechaSeguimiento: borrador.fechaSeguimiento || visita?.fechaSeguimiento || "",
          responsable: borrador.responsable || visita?.responsable || "",
          registroUrl: borrador.registroUrl || visita?.registroUrl || "",
        }, estado.crm.prospectos.length);

        let prospecto = { ...prospectoBase, sincronizacion: { pendiente: true, ok: false } };
        try {
          const sincronizado = await guardarProspectoEnSheets(prospectoBase, visita);
          prospecto = {
            ...prospectoBase,
            sincronizacion: {
              pendiente: false,
              ok: true,
              actualizadoEn: sincronizado?.sheet?.updatedAt || new Date().toISOString(),
              fila: sincronizado?.sheet?.updatedRange || "",
            },
          };
          await cargarProspectosDesdeSheets({ forzar: true }).catch(() => null);
        } catch (error) {
          prospecto = {
            ...prospectoBase,
            sincronizacion: {
              pendiente: true,
              ok: false,
              error: error instanceof Error ? error.message : "No se pudo sincronizar con Google Sheets.",
            },
          };
        }

        estado.crm.prospectos.unshift(prospecto);
        estado.crm.borrador = borradorCRMInicial();
        guardarEstado();
        renderRuta();
        if (prospecto.sincronizacion?.ok) mostrarToast("Prospecto guardado y enviado a Google Sheets.");
        else mostrarToast(`Prospecto guardado localmente, pero Google Sheets no respondió: ${prospecto.sincronizacion?.error || "revisa credenciales."}`, "error");
      });

      const limpiarBorrador = document.getElementById("limpiar-borrador-crm");
      if (limpiarBorrador) limpiarBorrador.addEventListener("click", () => {
        estado.crm.borrador = borradorCRMInicial();
        guardarEstado();
        renderRuta();
        mostrarToast("Editor del CRM limpio.");
      });

      document.getElementById("nuevo-registro").addEventListener("click", () => {
        estado.crm.borrador = borradorCRMInicial();
        guardarEstado();
        renderRuta();
        mostrarToast("Listo. Ya tienes un prospecto nuevo editable dentro del CRM.");
      });
    }

    function validarImportado(candidato) {
      if (!candidato || typeof candidato !== "object" || !Array.isArray(candidato.prioridades) || !candidato.frentes) return false;
      return candidato.prioridades.length === 3 && candidato.prioridades.every(p => p && typeof p.texto === "string" && typeof p.completada === "boolean") &&
        Object.keys(estadoInicial.frentes).every(clave => {
          const f = candidato.frentes[clave];
          return f && f.metricas && typeof f.nota === "string" && Object.hasOwn(estadosOperativos, f.semaforo || f.semaforo_ejemplo);
        });
    }

    function exportarDatos() {
      const respaldo = { tipo: "GUARDIAN_OPS_RESPALDO", compatible_con: "JOE_OS_MISSION_CONTROL", version: 5, exportado_en: new Date().toISOString(), estado };
      const url = URL.createObjectURL(new Blob([JSON.stringify(respaldo, null, 2)], { type: "application/json" }));
      const enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = `guardian-ops-respaldo-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      mostrarToast("Respaldo descargado.");
    }

    async function importarDatos(archivo) {
      try {
        const leido = JSON.parse(await archivo.text());
        const candidato = leido.estado || leido;
        if (!validarImportado(candidato)) throw new Error("Respaldo no válido");
        estado = normalizarEstado(candidato);
        guardarEstado();
        renderRuta();
        mostrarToast("Datos restaurados correctamente.");
      } catch (error) {
        mostrarToast("Selecciona un respaldo válido de Mission Control o Guardian Ops.", "error");
      }
    }

    document.addEventListener("click", (evento) => {
      const link = evento.target.closest(".nav__link");
      if (!link) return;
      evento.preventDefault();
      navegar(link.dataset.route);
    });
    window.addEventListener("popstate", renderRuta);
    document.getElementById("exportar").addEventListener("click", exportarDatos);
    document.getElementById("importar").addEventListener("click", () => document.getElementById("archivo-importar").click());
    document.getElementById("photo-modal-close").addEventListener("click", cerrarPreviewGrande);
    document.getElementById("photo-modal").addEventListener("click", (evento) => {
      if (evento.target.id === "photo-modal") cerrarPreviewGrande();
    });
    document.addEventListener("keydown", (evento) => {
      if (evento.key === "Escape") cerrarPreviewGrande();
    });
    document.getElementById("archivo-importar").addEventListener("change", (evento) => {
      if (evento.target.files[0]) importarDatos(evento.target.files[0]);
      evento.target.value = "";
    });

    guardarEstado();
    renderRuta();
    cargarSesion();
  </script>
</body>
</html>
