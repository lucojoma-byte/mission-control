<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">
  <title>Guardian Ops · Holding</title>
  <style>
    :root {
      --fondo: #0b0e14;
      --superficie: #121722;
      --superficie-2: #181f2d;
      --superficie-3: #20293a;
      --borde: #293244;
      --texto: #f3f5f7;
      --suave: #9aa6b6;
      --acento: #d6aa53;
      --acento-2: #f1d28d;
      --verde: #32c877;
      --amarillo: #e8b84b;
      --rojo: #ef5b5b;
      --azul: #58a6ff;
      --radio: 16px;
      --sombra: 0 16px 40px rgba(0, 0, 0, 0.24);
      --sidebar: 242px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }
    [hidden] { display: none !important; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: var(--sidebar);
      padding: 24px 16px;
      border-right: 1px solid var(--borde);
      background: #0e121a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px 22px;
      border-bottom: 1px solid var(--borde);
    }
    .brand__mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--acento) 70%, var(--borde));
      border-radius: 11px;
      color: var(--acento);
      background: color-mix(in srgb, var(--acento) 10%, transparent);
      font-weight: 900;
    }
    .brand__eyebrow {
      margin: 0;
      color: var(--acento);
      font-size: .68rem;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .brand__name { margin: 1px 0 0; font-size: 1.02rem; }
    .nav { display: grid; gap: 5px; margin-top: 22px; }
    .nav__link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--suave);
      text-decoration: none;
      font-size: .88rem;
      font-weight: 650;
    }
    .nav__icon {
      width: 24px;
      color: inherit;
      text-align: center;
      font-size: .92rem;
    }
    .nav__link:hover, .nav__link:focus-visible {
      border-color: var(--borde);
      color: var(--texto);
      outline: none;
    }
    .nav__link[aria-current="page"] {
      border-color: color-mix(in srgb, var(--acento) 38%, var(--borde));
      color: var(--acento-2);
      background: color-mix(in srgb, var(--acento) 10%, transparent);
    }
    .sidebar__foot {
      position: absolute;
      right: 16px;
      bottom: 20px;
      left: 16px;
      padding: 12px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      color: var(--suave);
      background: var(--superficie);
      font-size: .72rem;
    }
    .sidebar__foot strong { display: block; color: var(--texto); font-size: .78rem; }

    .main { min-height: 100vh; margin-left: var(--sidebar); padding: 28px 30px 108px; }
    .contenedor { width: min(1180px, 100%); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--acento);
      font-size: .72rem;
      font-weight: 850;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .page-title {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.7rem);
      letter-spacing: -.04em;
      line-height: 1.07;
    }
    .page-purpose { max-width: 720px; margin: 8px 0 0; color: var(--suave); font-size: .92rem; }
    .date { margin: 2px 0 0; color: var(--suave); text-align: right; white-space: nowrap; }

    .card {
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      background: var(--superficie);
      box-shadow: var(--sombra);
    }
    .section-card { padding: 20px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 15px;
    }
    .section-title { margin: 0; font-size: 1rem; }
    .section-help { margin: 0; color: var(--suave); font-size: .8rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      color: var(--suave);
      background: var(--superficie-2);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }
    .status--active { border-color: color-mix(in srgb, var(--verde) 45%, var(--borde)); color: var(--verde); }
    .status--build { border-color: color-mix(in srgb, var(--amarillo) 45%, var(--borde)); color: var(--amarillo); }

    .priorities { margin-bottom: 22px; }
    .priority-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .priority {
      display: flex;
      align-items: center;
      min-height: 54px;
      gap: 10px;
      padding: 10px 13px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--superficie-2);
    }
    .priority input[type="checkbox"] {
      flex: 0 0 auto;
      width: 19px;
      height: 19px;
      margin: 0;
      accent-color: var(--acento);
      cursor: pointer;
    }
    .priority input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 3px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      color: var(--texto);
      background: transparent;
      outline: none;
    }
    .priority input[type="text"]:focus { border-color: var(--acento); }
    .priority--done input[type="text"] { color: var(--suave); text-decoration: line-through; }

    .metric-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
    .quick-metric { padding: 16px; }
    .quick-metric__label { display: block; color: var(--suave); font-size: .74rem; }
    .quick-metric__value { display: block; margin-top: 5px; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
    .quick-metric__meta { display: block; margin-top: 3px; color: var(--suave); font-size: .7rem; }
    .quick-metric__value--ok { color: var(--verde); }
    .quick-metric__value--warn { color: var(--amarillo); }

    .panel-head { margin: 0 0 15px; }
    .panel-title { margin: 0 0 3px; font-size: 1.15rem; }
    .panel-subtitle { margin: 0; color: var(--suave); font-size: .86rem; }
    .front-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .front-card {
      --state-color: var(--amarillo);
      min-height: 264px;
      padding: 21px;
      border-left: 5px solid var(--state-color);
    }
    .front-card--wide { grid-column: 1 / -1; }
    .front-card--verde { --state-color: var(--verde); }
    .front-card--amarillo { --state-color: var(--amarillo); }
    .front-card--rojo { --state-color: var(--rojo); }
    .front-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .front-title { margin: 0; font-size: 1.05rem; }
    .state-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid color-mix(in srgb, var(--state-color) 48%, transparent);
      border-radius: 999px;
      color: var(--state-color);
      background: color-mix(in srgb, var(--state-color) 10%, transparent);
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .state-pill::before { width: 8px; height: 8px; border-radius: 50%; background: currentColor; content: ""; }
    .state-control { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .state-control__label { margin-right: 2px; color: var(--suave); font-size: .72rem; }
    .state-button {
      --option-color: var(--suave);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 6px 9px;
      border: 1px solid var(--borde);
      border-radius: 9px;
      color: var(--suave);
      background: var(--superficie-2);
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .state-button::before { width: 8px; height: 8px; border-radius: 50%; background: var(--option-color); content: ""; }
    .state-button--verde { --option-color: var(--verde); }
    .state-button--amarillo { --option-color: var(--amarillo); }
    .state-button--rojo { --option-color: var(--rojo); }
    .state-button[aria-pressed="true"] {
      border-color: var(--option-color);
      color: var(--option-color);
      background: color-mix(in srgb, var(--option-color) 12%, var(--superficie-2));
    }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }
    .metric { min-width: 0; padding: 12px; border: 1px solid var(--borde); border-radius: 11px; background: var(--superficie-2); }
    .metric__label { display: block; overflow: hidden; color: var(--suave); font-size: .72rem; text-overflow: ellipsis; white-space: nowrap; }
    .metric__value { display: block; margin-top: 3px; font-size: 1.18rem; font-weight: 750; }
    .note { margin: 0; padding-top: 13px; border-top: 1px solid var(--borde); color: var(--suave); font-size: .82rem; }
    .note strong { color: var(--texto); }

    .module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .module-card { display: flex; flex-direction: column; min-height: 205px; padding: 19px; }
    .module-card__kicker { color: var(--acento); font-size: .7rem; font-weight: 800; text-transform: uppercase; }
    .module-card h3 { margin: 9px 0 6px; font-size: 1.05rem; }
    .module-card p { margin: 0; color: var(--suave); font-size: .84rem; }
    .module-card .button { margin-top: auto; align-self: flex-start; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--superficie-2);
      font-weight: 700;
      font-size: .82rem;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover, .button:focus-visible { border-color: var(--acento); outline: none; }
    .button--primary { border-color: var(--acento); color: #111; background: var(--acento); }
    .button--danger { border-color: color-mix(in srgb, var(--rojo) 55%, var(--borde)); color: var(--rojo); }

    .field-shell { max-width: 880px; margin: 0 auto; }
    .field-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .field-step {
      padding: 10px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--suave);
      background: var(--superficie);
      text-align: center;
      font-size: .76rem;
      font-weight: 750;
    }
    .field-step--active { border-color: var(--acento); color: var(--acento-2); }
    .field-card { padding: clamp(18px, 4vw, 30px); }
    .field-card h2 { margin: 0 0 5px; font-size: 1.35rem; }
    .field-card > p { margin: 0 0 22px; color: var(--suave); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; }
    .field--wide { grid-column: 1 / -1; }
    .field label { color: var(--suave); font-size: .8rem; font-weight: 700; }
    .input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      color: var(--texto);
      background: var(--superficie-2);
      outline: none;
    }
    textarea.input { min-height: 112px; resize: vertical; }
    .input:focus { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 13%, transparent); }
    .photo-zone {
      display: grid;
      min-height: 118px;
      align-items: start;
      padding: 18px;
      border: 1px dashed color-mix(in srgb, var(--acento) 55%, var(--borde));
      border-radius: 12px;
      color: var(--suave);
      background: color-mix(in srgb, var(--acento) 5%, var(--superficie-2));
      text-align: center;
      cursor: pointer;
    }
    .photo-zone strong { display: block; color: var(--texto); }
    .photo-zone__body { display: grid; gap: 12px; width: 100%; }
    .photo-zone__empty { display: grid; gap: 4px; }
    .photo-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .photo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--borde);
      border-radius: 11px;
      color: var(--texto);
      background: var(--superficie-2);
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .photo-button:hover, .photo-button:focus-visible { border-color: var(--acento); outline: none; }
    .photo-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      width: 100%;
    }
    .photo-preview-card {
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: var(--superficie);
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }
    .photo-preview-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: inherit;
      cursor: zoom-in;
    }
    .photo-preview-card img {
      display: block;
      width: 100%;
      height: clamp(220px, 34vw, 320px);
      object-fit: contain;
      background: color-mix(in srgb, var(--superficie-2) 82%, black);
    }
    .photo-preview-card span {
      display: block;
      padding: 8px 10px;
      color: var(--suave);
      font-size: .72rem;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .photo-preview-hint {
      margin-top: 8px;
      color: var(--suave);
      font-size: .72rem;
      text-align: left;
    }
    .field-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .field-actions .button { min-height: 52px; padding-inline: 20px; font-size: .9rem; }
    .visit-history {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .visit-history__head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .visit-history__head h3 { margin: 0; font-size: 1rem; }
    .visit-history__head p { margin: 4px 0 0; color: var(--suave); font-size: .8rem; }
    .visit-history__list {
      display: grid;
      gap: 12px;
    }
    .visit-card {
      padding: 16px;
      border: 1px solid var(--borde);
      border-radius: 14px;
      background: var(--superficie-2);
    }
    .visit-card__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .visit-card__title { margin: 0; font-size: .98rem; }
    .visit-card__time { color: var(--suave); font-size: .74rem; white-space: nowrap; }
    .visit-card__meta,
    .visit-card__ids {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 10px;
      padding: 0;
      list-style: none;
    }
    .visit-card__meta li,
    .visit-card__ids li {
      padding: 6px 9px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      color: var(--suave);
      background: var(--superficie);
      font-size: .72rem;
    }
    .visit-card__note {
      margin: 0 0 12px;
      color: var(--suave);
      font-size: .78rem;
    }
    .visit-card__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .visit-card__actions .button { min-height: 40px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--borde); border-radius: var(--radio); background: var(--superficie); }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--borde); text-align: left; font-size: .82rem; }
    th { color: var(--suave); background: var(--superficie-2); font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    .table-title { color: var(--texto); font-weight: 750; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .search { width: min(390px, 100%); min-height: 43px; padding: 10px 13px; border: 1px solid var(--borde); border-radius: 10px; color: var(--texto); background: var(--superficie); outline: none; }
    .search:focus { border-color: var(--acento); }
    .empty { padding: 36px 20px; color: var(--suave); text-align: center; }

    .report-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .report { padding: 20px; }
    .report__label { color: var(--suave); font-size: .76rem; }
    .report__value { display: block; margin-top: 7px; font-size: 1.75rem; font-weight: 850; }
    .report__detail { margin: 7px 0 0; color: var(--suave); font-size: .78rem; }

    .quickbar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: var(--sidebar);
      z-index: 20;
      padding: 11px 30px;
      border-top: 1px solid var(--borde);
      background: rgba(11, 14, 20, .94);
      backdrop-filter: blur(14px);
    }
    .quickbar__content { display: flex; align-items: center; gap: 9px; overflow-x: auto; scrollbar-width: none; }
    .quickbar__content::-webkit-scrollbar { display: none; }
    .quick-link { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--borde); border-radius: 9px; color: var(--texto); background: var(--superficie); font-size: .78rem; text-decoration: none; cursor: pointer; }
    .quick-link:hover, .quick-link:focus-visible { border-color: var(--acento); outline: none; }
    .quick-link--label { border-color: transparent; color: var(--suave); background: transparent; font-weight: 750; pointer-events: none; }
    body.campo-mode .quickbar,
    body.campo-mode .sidebar__foot,
    body.campo-mode .nav__link:not([data-route="/holding/campo"]):not([data-route="/holding/mission-control"]) { display: none; }
    body.campo-mode .main { padding-bottom: 24px; }
    .file-input { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 74px;
      z-index: 50;
      max-width: min(380px, calc(100% - 40px));
      padding: 11px 14px;
      border: 1px solid var(--verde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--superficie-2);
      box-shadow: var(--sombra);
      font-size: .82rem;
    }
    .toast--error { border-color: var(--rojo); }
    .photo-modal[hidden] { display: none !important; }
    .photo-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(5, 8, 14, .86);
      backdrop-filter: blur(8px);
    }
    .photo-modal__dialog {
      width: min(980px, 100%);
      max-height: min(92vh, 980px);
      padding: 14px;
      border: 1px solid var(--borde);
      border-radius: 18px;
      background: var(--superficie);
      box-shadow: var(--sombra);
    }
    .photo-modal__topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .photo-modal__title {
      margin: 0;
      color: var(--texto);
      font-size: .92rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .photo-modal__close {
      flex: 0 0 auto;
      min-width: 44px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--borde);
      border-radius: 10px;
      color: var(--texto);
      background: var(--superficie-2);
      cursor: pointer;
    }
    .photo-modal__frame {
      display: grid;
      place-items: center;
      min-height: min(72vh, 720px);
      border-radius: 14px;
      background: color-mix(in srgb, var(--superficie-2) 82%, black);
      overflow: hidden;
    }
    .photo-modal__frame img {
      display: block;
      max-width: 100%;
      max-height: min(72vh, 720px);
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .menu-button { display: none; }

    @media (max-width: 980px) {
      :root { --sidebar: 82px; }
      .sidebar { width: var(--sidebar); padding-inline: 12px; }

      .module-grid, .report-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      :root { --sidebar: 0px; }
      .sidebar {
        width: min(288px, 86vw);
        transform: translateX(-102%);
        transition: transform .2s ease;
        box-shadow: 20px 0 50px rgba(0,0,0,.35);
      }
      .sidebar--open { transform: translateX(0); }
      .brand { justify-content: flex-start; padding-inline: 8px; }

      .nav__link { justify-content: flex-start; padding-inline: 12px; }
      .nav__icon { width: 24px; }
      .main { margin-left: 0; padding: 20px 16px 118px; }
      .quickbar { left: 0; padding-inline: 16px; }
      .menu-button {
        display: inline-grid;
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--borde);

      .priority-grid, .front-grid, .module-grid, .report-grid, .form-grid { grid-template-columns: 1fr; }
      .front-card--wide, .field--wide { grid-column: auto; }
      .toolbar { align-items: stretch; flex-direction: column; }

    }

    @media (max-width: 460px) {
      .metric-strip { grid-template-columns: 1fr 1fr; }
      .quick-metric { padding: 13px; }
      .quick-metric__value { font-size: 1.25rem; }
      .metrics { grid-template-columns: 1fr; }

      .photo-preview-grid { grid-template-columns: 1fr; }
      .photo-preview-card img { height: min(62vw, 320px); }

      .photo-modal__frame img { max-height: min(68vh, 560px); }
      .photo-actions { grid-template-columns: 1fr; }
      .section-head, .field-actions { align-items: stretch; flex-direction: column; }
      .field-actions .button { width: 100%; }
    }
  </style>
</head>
<body>

        Datos locales en este dispositivo

    <main class="main">

    <nav class="quickbar" aria-label="Accesos rápidos">

      </div>

  </div>

  <script>
    const CLAVE_ALMACENAMIENTO = "joe_os_mission_control_v1";
    const RUTAS = [
      "/holding",
      "/holding/mission-control",
      "/holding/campo",
      "/holding/campo/registro",
      "/holding/crm",
      "/holding/cotizaciones",
      "/holding/aprobaciones",
      "/holding/reportes"
    ];

    const estadoInicial = {
      version: 3,
      prioridades: [
        { id: 1, texto: "Revisar agenda de Casa Kiraz", completada: false },
        { id: 2, texto: "Evaluar candidatos de TikTok Shop", completada: false },
        { id: 3, texto: "Completar bloque de sistema", completada: false }
      ],
      frentes: {
        casa_kiraz: {
          nombre: "Casa Kiraz",
          semaforo: "verde",
          metricas: { citas_semana: 18, meta_citas: 16, caja_semana: 8450 },
          nota: "Reforzar agenda del viernes y sábado."
        },
        tiktok_shop: {
          nombre: "TikTok Shop",
          semaforo: "amarillo",
          metricas: { candidatos_pipeline: 5, productos_en_test: 0, ventas_validadas: 0 },
          nota: "Elegir el ganador en el Ritual del Martes."
        },
        trading: {
          nombre: "Trading",
          semaforo: "rojo",
          metricas: { pnl_semana: 125, reglas_cumplidas_pct: 80, drawdown_pct: 2.1, drawdown_limite: 3 },
          nota: "Profit con reglas rotas sigue siendo rojo."
        },
        real_estate_e2: {
          nombre: "Real Estate / E-2",
          semaforo: "verde",
          metricas: { candidatos_evaluados_mes: 7, en_analisis_profundo: 2, dias_desde_ultimo_barrido: 6 },
          nota: "Dar seguimiento a los dos candidatos finalistas."
        },
        sistema: {
          nombre: "Sistema",
          semaforo: "amarillo",
          metricas: { prioridades_completadas_semana: 2, automatizaciones_activas: 4, automatizaciones_caidas: 0 },
          nota: "Falta cerrar una prioridad semanal."
        }
      },
      campo: { borrador: {}, guardados: [] }
    };

    const configuracionMetricas = {
      casa_kiraz: [["citas_semana", "Citas esta semana", "numero"], ["meta_citas", "Meta de citas", "numero"], ["caja_semana", "Caja semanal", "moneda"]],
      tiktok_shop: [["candidatos_pipeline", "Candidatos", "numero"], ["productos_en_test", "Productos en test", "numero"], ["ventas_validadas", "Ventas validadas", "numero"]],
      trading: [["pnl_semana", "P&L semanal", "resultado"], ["reglas_cumplidas_pct", "Reglas cumplidas", "porcentaje"], ["drawdown_pct", "Drawdown", "porcentaje"], ["drawdown_limite", "Límite de drawdown", "porcentaje"]],
      real_estate_e2: [["candidatos_evaluados_mes", "Evaluados este mes", "numero"], ["en_analisis_profundo", "Análisis profundo", "numero"], ["dias_desde_ultimo_barrido", "Días desde barrido", "numero"]],
      sistema: [["prioridades_completadas_semana", "Prioridades completadas", "numero"], ["automatizaciones_activas", "Automatizaciones activas", "numero"], ["automatizaciones_caidas", "Automatizaciones caídas", "numero"]]
    };
    const estadosOperativos = { verde: "Operando / Validado", amarillo: "En proceso / En pausa", rojo: "Alerta / Desechado" };

    const modulos = [
      ["Mission Control", "Tablero ejecutivo con prioridades, frentes, semáforos y señales operativas.", "/holding/mission-control", "Activo"],
      ["Campo", "Captura guiada para visitas, medidas, evidencia y notas desde tablet.", "/holding/campo", "Piloto"],
      ["CRM", "Seguimiento central de prospectos, clientes y siguiente acción.", "/holding/crm", "En construcción"],
      ["Cotizaciones", "Bandeja para preparar, revisar y dar seguimiento a propuestas.", "/holding/cotizaciones", "En construcción"],
      ["Aprobaciones", "Decisiones que requieren autorización humana antes de avanzar.", "/holding/aprobaciones", "En construcción"],
      ["Reportes", "Indicadores operativos, comerciales y financieros del holding.", "/holding/reportes", "En construcción"]
    ];

    function copiaInicial() { return JSON.parse(JSON.stringify(estadoInicial)); }

    function consecutivoDesdeValor(valor, extra = 0) {
      const digitos = String(Math.abs(Number(valor) || Date.now()) + extra).replace(/\D/g, "");
      return digitos.slice(-6).padStart(6, "0");
    }

    function derivarIdsVisita(visita = {}, indice = 0) {
      const fuente = visita.id || visita.guardadoEn || Date.now() + indice;
      return {
        clienteId: visita.clienteId || `CL-${consecutivoDesdeValor(fuente, indice * 3)}`,
        leadId: visita.leadId || `LE-${consecutivoDesdeValor(fuente, (indice * 3) + 1)}`,
        ticketId: visita.ticketId || `TK-${consecutivoDesdeValor(fuente, (indice * 3) + 2)}`,
      };
    }

    function normalizarEstado(candidato) {
      const base = copiaInicial();
      const normal = candidato && typeof candidato === "object" ? candidato : base;
      normal.version = 5;
      normal.prioridades = Array.isArray(normal.prioridades) ? normal.prioridades : base.prioridades;
      normal.frentes = normal.frentes || base.frentes;
      Object.keys(base.frentes).forEach((clave) => {
        const guardado = normal.frentes[clave] || base.frentes[clave];
        guardado.semaforo = guardado.semaforo || guardado.semaforo_ejemplo || base.frentes[clave].semaforo;
        delete guardado.semaforo_ejemplo;
        normal.frentes[clave] = { ...base.frentes[clave], ...guardado, metricas: { ...base.frentes[clave].metricas, ...(guardado.metricas || {}) } };
      });
      normal.campo = normal.campo && typeof normal.campo === "object" ? normal.campo : base.campo;
      normal.campo.borrador = normal.campo.borrador || {};
      normal.campo.guardados = (Array.isArray(normal.campo.guardados) ? normal.campo.guardados : []).map((visita, indice) => ({
        ...visita,
        ...derivarIdsVisita(visita, indice),
      }));
      return normal;
    }

    function cargarEstado() {
      try {
        const guardado = localStorage.getItem(CLAVE_ALMACENAMIENTO);
        return normalizarEstado(guardado ? JSON.parse(guardado) : copiaInicial());
      } catch (error) {
        console.warn("No se pudo leer el estado local.", error);
        return copiaInicial();
      }
    }

    let estado = cargarEstado();
    let temporizadorToast;
    let pasoCampo = 1;
    let previewsCampo = [];
    let guardandoCampo = false;

    function guardarEstado() {
      try { localStorage.setItem(CLAVE_ALMACENAMIENTO, JSON.stringify(estado)); }
      catch (error) { mostrarToast("No se pudo guardar en este dispositivo.", "error"); }
    }

    function mostrarToast(mensaje, tipo = "ok") {
      const toast = document.getElementById("toast");
      clearTimeout(temporizadorToast);
      toast.textContent = mensaje;
      toast.className = tipo === "error" ? "toast toast--error" : "toast";
      toast.hidden = false;
      temporizadorToast = setTimeout(() => { toast.hidden = true; }, 3800);
    }

    async function guardarVisitaRemota(visita) {
      const respuesta = await fetch("/api/campo-visitas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          visita,
          fotos: previewsCampo.map((preview) => ({ nombre: preview.nombre, dataUrl: preview.url }))
        })
      });
      const data = await respuesta.json().catch(() => ({}));
      if (!respuesta.ok || !data?.ok || !data?.visita) {
        throw new Error(data?.error || "No se pudo guardar la visita en almacenamiento real.");
      }
      return data.visita;
    }

    function formatearFechaHora(fechaIso) {
      if (!fechaIso) return "Sin fecha";
      try {
        return new Intl.DateTimeFormat("es-MX", {
          day: "2-digit",
          month: "short",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(fechaIso));
      } catch {
        return fechaIso;
      }
    }

    function escapeHtml(valor = "") {
      return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function textoVisible(valor = "", fallback = "Sin dato") {
      const limpio = String(valor || "").trim();
      return limpio ? escapeHtml(limpio) : fallback;
    }

    function visitaActualDesdeRuta() {
      const visitaId = new URLSearchParams(window.location.search).get("visita");
      if (!visitaId) return null;
      return estado.campo.guardados.find((visita) => visita.id === visitaId) || null;
    }

    function cortarTexto(texto = "", maximo = 56) {
      const limpio = String(texto || "").trim();
      if (!limpio) return "Sin dirección";
      return limpio.length > maximo ? `${limpio.slice(0, maximo - 1)}…` : limpio;
    }

    function renderHistorialCampo() {
      if (!estado.campo.guardados.length) {
        return `
          <section class="card section-card visit-history">
            <div class="visit-history__head">
              <div>
                <h3>Visitas guardadas</h3>
                <p>Aquí aparecerán las capturas reales que salgan de Campo.</p>
              </div>
            </div>
            <div class="empty"><strong>Aún no hay visitas guardadas.</strong><br>Guarda una visita desde Campo para verla aquí con sus IDs y fotos.</div>
          </section>`;
      }

      return `
        <section class="card section-card visit-history">
          <div class="visit-history__head">
            <div>
              <h3>Visitas guardadas</h3>
              <p>Historial táctil de capturas guardadas con sus IDs y vínculo al registro.</p>
            </div>
            <span class="status status--active">${estado.campo.guardados.length} registradas</span>
          </div>
          <div class="visit-history__list">
            ${estado.campo.guardados.map((visita) => `
              <article class="visit-card">
                <div class="visit-card__top">
                  <div>
                    <h4 class="visit-card__title">${visita.cliente || "Sin cliente"}</h4>
                    <p class="visit-card__note">${visita.servicio || "Sin servicio"} · ${cortarTexto(visita.direccion)}</p>
                  </div>
                  <span class="visit-card__time">${formatearFechaHora(visita.guardadoEn)}</span>
                </div>
                <ul class="visit-card__ids">
                  <li>Cliente ID: ${visita.clienteId || "Pendiente"}</li>
                  <li>Lead ID: ${visita.leadId || "Pendiente"}</li>
                  <li>Ticket ID: ${visita.ticketId || "Pendiente"}</li>
                </ul>
                <ul class="visit-card__meta">
                  <li>${(visita.fotosRemotas || visita.fotos || []).length} foto(s)</li>
                  <li>${visita.storage || "Sin storage"}</li>
                  <li>${visita.telefono ? visita.telefono : "Sin teléfono"}</li>
                </ul>
                <div class="visit-card__actions">
                  <a class="button button--primary" data-route-link href="/holding/campo/registro?visita=${encodeURIComponent(visita.id || "")}">Ver registro</a>
                  ${visita.registroUrl ? `<a class="button" href="${escaparAtributo(visita.registroUrl)}" target="_blank" rel="noopener noreferrer">Descargar JSON</a>` : ""}
                  ${(visita.fotosRemotas || []).length ? `<a class="button" href="${escaparAtributo((visita.fotosRemotas || [])[0].url)}" target="_blank" rel="noopener noreferrer">Abrir foto</a>` : ""}
                </div>
              </article>`).join("")}
          </div>
        </section>`;
    }

    function renderRegistroCampo() {
      const visita = visitaActualDesdeRuta();
      if (!visita) {
        return `
          <div class="field-shell">
            ${cabecera("GUARDIÁN · OPERACIÓN EN SITIO", "Registro de visita", "Vista legible del registro capturado desde Campo.", "Piloto")}
            <section class="card field-card">
              <h2>Registro no encontrado</h2>
              <p>Esta visita ya no está guardada en este dispositivo o el enlace no es válido.</p>
              <div class="field-actions">
                <a class="button button--primary" data-route-link href="/holding/campo">Volver a Campo</a>
              </div>
            </section>
          </div>`;
      }

      const fotos = visita.fotosRemotas || visita.fotos || [];
      const bloques = [
        ["Cliente", visita.cliente],
        ["Teléfono", visita.telefono],
        ["Dirección", visita.direccion],
        ["Servicio", visita.servicio],
        ["Ancho", visita.ancho],
        ["Alto", visita.alto],
        ["Condición", visita.condicion],
        ["Responsable", visita.responsable],
        ["Seguimiento", visita.fechaSeguimiento],
        ["Notas", visita.notas],
      ];

      return `
        <div class="field-shell">
          ${cabecera("GUARDIÁN · OPERACIÓN EN SITIO", "Registro de visita", "Vista legible del registro capturado desde Campo.", "Piloto")}
          <section class="card field-card">
            <div class="visit-card__top" style="margin-bottom:18px">
              <div>
                <h2 style="margin:0 0 8px">${textoVisible(visita.cliente, "Sin cliente")}</h2>
                <p style="margin:0;color:var(--suave)">${textoVisible(visita.servicio, "Sin servicio")} · ${textoVisible(visita.direccion, "Sin dirección")}</p>
              </div>
              <span class="visit-card__time">${formatearFechaHora(visita.guardadoEn)}</span>
            </div>
            <ul class="visit-card__ids" style="margin-bottom:18px">
              <li>Cliente ID: ${textoVisible(visita.clienteId, "Pendiente")}</li>
              <li>Lead ID: ${textoVisible(visita.leadId, "Pendiente")}</li>
              <li>Ticket ID: ${textoVisible(visita.ticketId, "Pendiente")}</li>
            </ul>
            <div class="form-grid">
              ${bloques.map(([etiqueta, valor]) => `
                <div class="field ${etiqueta === "Notas" ? "field--wide" : ""}">
                  <label>${etiqueta}</label>
                  <div class="input" style="min-height:${etiqueta === "Notas" ? "110px" : "auto"};white-space:pre-wrap">${textoVisible(valor)}</div>
                </div>`).join("")}
            </div>
            <div class="field" style="margin-top:18px">
              <label>Fotos ligadas</label>
              ${fotos.length ? `
                <div class="photo-preview-grid" style="margin-top:10px">
                  ${fotos.map((foto, indice) => `
                    <figure class="photo-preview-card">
                      <button class="photo-preview-button" type="button" data-preview-url="${escaparAtributo(foto.url || foto)}" data-preview-nombre="${escaparAtributo(foto.nombre || `foto-${indice + 1}`)}" aria-label="Abrir foto ${indice + 1} en grande">
                        <img src="${escaparAtributo(foto.url || foto)}" alt="Foto ${indice + 1} de ${escaparAtributo(visita.cliente || 'visita')}">
                      </button>
                      <figcaption>${escapeHtml(foto.nombre || `Foto ${indice + 1}`)}</figcaption>
                    </figure>`).join("")}
                </div>` : `<div class="input" style="margin-top:10px">Sin fotos ligadas.</div>`}
            </div>
            <div class="field-actions">
              <a class="button" data-route-link href="/holding/campo">Volver a Campo</a>
              ${visita.registroUrl ? `<a class="button" href="${escaparAtributo(visita.registroUrl)}" target="_blank" rel="noopener noreferrer">Descargar JSON</a>` : ""}
            </div>
          </section>
        </div>`;
    }

    function fechaActual() {
      const texto = new Intl.DateTimeFormat("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function cabecera(etiqueta, titulo, proposito, estadoModulo = "") {
      return `
        <header class="topbar">
          <div class="topbar__title">
            <button class="menu-button" id="abrir-menu" type="button" aria-label="Abrir navegación">☰</button>
            <div>
              <p class="eyebrow">${etiqueta}</p>
              <h1 class="page-title">${titulo}</h1>
              <p class="page-purpose">${proposito}</p>
            </div>
          </div>
          <div>
            <p class="date">${fechaActual()}</p>
            ${estadoModulo ? `<p style="text-align:right;margin:10px 0 0"><span class="status ${estadoModulo === "Activo" ? "status--active" : "status--build"}">${estadoModulo}</span></p>` : ""}
          </div>
        </header>`;
    }

    function formatear(valor, formato) {
      const numero = Number(valor);
      if (formato === "moneda") return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 }).format(numero);
      if (formato === "porcentaje") return `${numero}%`;
      if (formato === "resultado") return `${numero > 0 ? "+" : ""}$${numero.toLocaleString("es-MX")}`;
      return numero.toLocaleString("es-MX");
    }

    function renderHolding() {
      return `
        ${cabecera("GUARDIAN OPS · FASE 1", "Holding", "Contenedor general de la operación. Desde aquí se entra a una sola app con módulos conectados.", "Activo")}
        <section class="metric-strip" aria-label="Resumen del holding">

    function abrirPreviewGrande(url, nombre) {
      const modal = document.getElementById("photo-modal");
      const imagen = document.getElementById("photo-modal-image");

      if (!modal || !imagen || !titulo) return;
      imagen.src = url;
      imagen.alt = nombre || "Vista ampliada de evidencia";
      titulo.textContent = nombre || "Vista ampliada";
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function cerrarPreviewGrande() {
      const modal = document.getElementById("photo-modal");
      const imagen = document.getElementById("photo-modal-image");
      const titulo = document.getElementById("photo-modal-title");
      if (!modal || !imagen || !titulo) return;
      modal.hidden = true;
      imagen.removeAttribute("src");

    function rutaActual() {
      const limpia = window.location.pathname.replace(/\/+$/, "") || "/";
      return RUTAS.includes(limpia) ? limpia : "/holding/mission-control";
    }

    function renderRuta() {
      const ruta = rutaActual();
      document.body.classList.toggle("campo-mode", ruta.startsWith("/holding/campo"));
      const vistas = {
        "/holding": renderHolding,
        "/holding/mission-control": renderMissionControl,
        "/holding/campo": renderCampo,
        "/holding/campo/registro": renderRegistroCampo,
        "/holding/crm": renderCRM,
        "/holding/cotizaciones": renderCotizaciones,
        "/holding/aprobaciones": renderAprobaciones,
        "/holding/reportes": renderReportes
      };
      document.getElementById("vista").innerHTML = vistas[ruta]();
      document.querySelectorAll(".nav__link").forEach(link => link.setAttribute("aria-current", link.dataset.route === ruta ? "page" : "false"));
      enlazarVista(ruta);
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function navegar(ruta) {
      history.pushState({}, "", ruta);
      document.getElementById("sidebar").classList.remove("sidebar--open");
      renderRuta();
    }

    function enlazarVista(ruta) {
      const menu = document.getElementById("abrir-menu");
      if (menu) menu.addEventListener("click", () => document.getElementById("sidebar").classList.toggle("sidebar--open"));

      document.querySelectorAll("[data-route-link]").forEach(link => link.addEventListener("click", (e) => {
        e.preventDefault();
        navegar(link.getAttribute("href"));
      }));

      if (ruta === "/holding/mission-control") {
        document.querySelectorAll("[data-prioridad-check]").forEach(input => input.addEventListener("change", () => {
          const indice = Number(input.dataset.prioridadCheck);
          estado.prioridades[indice].completada = input.checked;
          guardarEstado();
          renderRuta();
        }));
        document.querySelectorAll("[data-prioridad-texto]").forEach(input => input.addEventListener("input", () => {
          estado.prioridades[Number(input.dataset.prioridadTexto)].texto = input.value;
          guardarEstado();
        }));
        document.querySelectorAll("[data-frente]").forEach(boton => boton.addEventListener("click", () => {
          estado.frentes[boton.dataset.frente].semaforo = boton.dataset.color;
          guardarEstado();
          renderRuta();
        }));
      }

      if (ruta === "/holding/campo") enlazarCampo();
      if (ruta === "/holding/campo/registro") enlazarRegistroCampo();
      if (ruta === "/holding/crm") enlazarCRM();
    }

    function guardarBorradorVisible() {
      document.querySelectorAll("[data-campo]").forEach(campo => { estado.campo.borrador[campo.dataset.campo] = campo.value; });
      guardarEstado();
    }

    function enlazarCampo() {
      document.querySelectorAll("[data-campo]").forEach(campo => campo.addEventListener("input", guardarBorradorVisible));
      const renderizarPreviewsEnDOM = () => {
        const contenedor = document.getElementById("fotos-preview");
        if (!contenedor) return;
        contenedor.innerHTML = renderPreviewsCampo();
        contenedor.querySelectorAll(".photo-preview-button").forEach(boton => boton.addEventListener("click", () => {
          abrirPreviewGrande(boton.dataset.previewUrl, boton.dataset.previewNombre);
        }));
      };
      renderizarPreviewsEnDOM();
      const prepararPreviews = async (archivos) => Promise.all(Array.from(archivos).map((archivo) => new Promise((resolve) => {
        const lector = new FileReader();
        lector.onload = () => {
          const imagen = new Image();
          imagen.onload = () => {
            const ladoMaximo = 1600;
            const escala = Math.min(1, ladoMaximo / Math.max(imagen.width || 1, imagen.height || 1));
            const ancho = Math.max(1, Math.round((imagen.width || 1) * escala));
            const alto = Math.max(1, Math.round((imagen.height || 1) * escala));
            const canvas = document.createElement("canvas");
            canvas.width = ancho;
            canvas.height = alto;
            const contexto = canvas.getContext("2d");
            if (!contexto) {
              resolve({ nombre: archivo.name || "foto-capturada.jpg", url: lector.result });
              return;
            }
            contexto.drawImage(imagen, 0, 0, ancho, alto);
            const nombreBase = (archivo.name || "foto-capturada").replace(/\.[^.]+$/, "");
            resolve({ nombre: `${nombreBase}.jpg`, url: canvas.toDataURL("image/jpeg", 0.82) });
          };
          imagen.onerror = () => resolve({ nombre: archivo.name || "Foto capturada", url: lector.result });
          imagen.src = lector.result;
        };
        lector.onerror = () => resolve(null);
        lector.readAsDataURL(archivo);
      }))).then((items) => items.filter(Boolean));
      const actualizarResumenFotos = (archivos, origen) => {
        estado.campo.borrador.fotos = archivos.length
          ? `${archivos.length} foto${archivos.length === 1 ? "" : "s"} ${origen} lista(s) para guardar`
          : "";
        guardarEstado();
        document.getElementById("fotos-resumen").textContent = estado.campo.borrador.fotos || "Elige si quieres tomar foto o abrir galería";
      };
      const fotosCamara = document.getElementById("campo-fotos-camara");
      const fotosGaleria = document.getElementById("campo-fotos-galeria");
      if (fotosCamara) fotosCamara.addEventListener("change", async () => {
        previewsCampo = await prepararPreviews(fotosCamara.files);
        actualizarResumenFotos(fotosCamara.files, "tomada(s) con cámara");
        renderizarPreviewsEnDOM();
      });
      if (fotosGaleria) fotosGaleria.addEventListener("change", async () => {
        previewsCampo = await prepararPreviews(fotosGaleria.files);
        actualizarResumenFotos(fotosGaleria.files, "seleccionada(s) desde galería");
        renderizarPreviewsEnDOM();
      });
      document.getElementById("campo-atras").addEventListener("click", () => {
        guardarBorradorVisible();
        if (pasoCampo > 1) pasoCampo -= 1;
        else {
          estado.campo.borrador = {};
          previewsCampo = [];
          guardarEstado();
          mostrarToast("Borrador limpio.");
        }
        renderRuta();
      });
      document.getElementById("campo-siguiente").addEventListener("click", async () => {
        guardarBorradorVisible();
        if (pasoCampo < 3) {
          if (pasoCampo === 1 && (!estado.campo.borrador.cliente || !estado.campo.borrador.servicio)) {
            mostrarToast("Captura cliente y servicio para continuar.", "error");
            return;
          }
          pasoCampo += 1;
          renderRuta();
          return;
        }
        if (guardandoCampo) return;
        guardandoCampo = true;
        try {
          const visitaBase = { ...estado.campo.borrador };
          const visitaRemota = await guardarVisitaRemota(visitaBase);
          estado.campo.guardados.unshift({
            ...visitaBase,
            id: visitaRemota.id,
            guardadoEn: visitaRemota.guardadoEn,
            clienteId: visitaRemota.clienteId,
            leadId: visitaRemota.leadId,
            ticketId: visitaRemota.ticketId,
            storage: visitaRemota.storage,
            registroUrl: visitaRemota.registroUrl,
            registroPath: visitaRemota.registroPath,
            fotosRemotas: visitaRemota.fotos,
          });
          estado.campo.borrador = {};
          previewsCampo = [];
          pasoCampo = 1;
          guardarEstado();
          mostrarToast(visitaRemota.fotos?.length ? "Visita y fotos guardadas. Ya aparecen ligadas al registro." : "Visita guardada en almacenamiento real.");
          renderRuta();
        } catch (error) {
          mostrarToast(error instanceof Error ? error.message : "No se pudo guardar la visita.", "error");
        } finally {
          guardandoCampo = false;
        }
      });
    }

    function enlazarRegistroCampo() {
      document.querySelectorAll(".photo-preview-button").forEach((boton) => boton.addEventListener("click", () => {
        abrirPreviewGrande(boton.dataset.previewUrl, boton.dataset.previewNombre);
      }));
    }

    function enlazarCRM() {
      const buscador = document.getElementById("buscar-crm");
      buscador.addEventListener("input", () => {
        const termino = buscador.value.toLocaleLowerCase("es");
        document.querySelectorAll("#crm-body tr").forEach(fila => { fila.hidden = !fila.textContent.toLocaleLowerCase("es").includes(termino); });
      });
      document.getElementById("nuevo-registro").addEventListener("click", () => mostrarToast("La alta completa de prospectos se habilitará en la siguiente fase."));
    }

    function validarImportado(candidato) {
      if (!candidato || typeof candidato !== "object" || !Array.isArray(candidato.prioridades) || !candidato.frentes) return false;
      return candidato.prioridades.length === 3 && candidato.prioridades.every(p => p && typeof p.texto === "string" && typeof p.completada === "boolean") &&
        Object.keys(estadoInicial.frentes).every(clave => {
          const f = candidato.frentes[clave];
          return f && f.metricas && typeof f.nota === "string" && Object.hasOwn(estadosOperativos, f.semaforo || f.semaforo_ejemplo);
        });
    }

    function exportarDatos() {
      const respaldo = { tipo: "GUARDIAN_OPS_RESPALDO", compatible_con: "JOE_OS_MISSION_CONTROL", version: 5, exportado_en: new Date().toISOString(), estado };
      const url = URL.createObjectURL(new Blob([JSON.stringify(respaldo, null, 2)], { type: "application/json" }));
      const enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = `guardian-ops-respaldo-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      mostrarToast("Respaldo descargado.");
    }

    async function importarDatos(archivo) {
      try {
        const leido = JSON.parse(await archivo.text());
        const candidato = leido.estado || leido;
        if (!validarImportado(candidato)) throw new Error("Respaldo no válido");
        estado = normalizarEstado(candidato);
        guardarEstado();
        renderRuta();
        mostrarToast("Datos restaurados correctamente.");
      } catch (error) {
        mostrarToast("Selecciona un respaldo válido de Mission Control o Guardian Ops.", "error");
      }
    }

    document.addEventListener("click", (evento) => {
      const link = evento.target.closest(".nav__link");
      if (!link) return;
      evento.preventDefault();
      navegar(link.dataset.route);
    });
    window.addEventListener("popstate", renderRuta);
    document.getElementById("exportar").addEventListener("click", exportarDatos);
    document.getElementById("importar").addEventListener("click", () => document.getElementById("archivo-importar").click());
    document.getElementById("photo-modal-close").addEventListener("click", cerrarPreviewGrande);
    document.getElementById("photo-modal").addEventListener("click", (evento) => {
      if (evento.target.id === "photo-modal") cerrarPreviewGrande();
    });
    document.addEventListener("keydown", (evento) => {
      if (evento.key === "Escape") cerrarPreviewGrande();
    });
    document.getElementById("archivo-importar").addEventListener("change", (evento) => {
      if (evento.target.files[0]) importarDatos(evento.target.files[0]);
      evento.target.value = "";
    });

    guardarEstado();
    renderRuta();
  </script>
</body>
</html>
